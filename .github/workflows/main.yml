name: Deploy to cPanel

on:
  push:
    branches:
      - savi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_SERVER_DIR: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
        run: |
          required_secrets=(
            CPANEL_FTP_SERVER
            CPANEL_FTP_USERNAME
            CPANEL_FTP_PASSWORD
            CPANEL_FTP_SERVER_DIR
          )
          missing_secrets=()

          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if ((${#missing_secrets[@]})); then
            printf '::error::Missing required GitHub Actions secret(s): %s. Add them under Settings > Secrets and variables > Actions.\n' \
              "$(IFS=', '; echo "${missing_secrets[*]}")"
            exit 1
          fi

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
          protocol: ftps
          port: 21
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            dbconfig.php
